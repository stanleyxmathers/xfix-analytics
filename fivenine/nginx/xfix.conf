# xfix.fivenine.space — рабочие инструменты XFIX за входом fivenine:
#   /analytics/ — дашборд аналитики (статика /var/www/xfix/analytics)
#   /tasks/     — доска задач (XFIX Tracker, 127.0.0.1:4190)
#   /roadmap/   — дорожная карта (XFIX Tracker, 127.0.0.1:4190) — открыта по ссылке, без входа
#   /assist/    — панель бота поддержки (telegram-support-bot, 127.0.0.1:3000)
#   /leads/     — админка заявок мини-приложения (xfix-price, 127.0.0.1:8090): admin, partners, checks
# Вход — тот же сервис fivenine-auth (127.0.0.1:4180). Сессия на этом поддомене своя.
# Сертификат: certbot certonly --webroot -w /var/www/html -d xfix.fivenine.space
# (порт 80 и ACME отвечает общий default_server из sites-available/fivenine).

server {
    listen 80;
    listen [::]:80;
    server_name xfix.fivenine.space;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://xfix.fivenine.space$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xfix.fivenine.space;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/xfix.fivenine.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xfix.fivenine.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/xfix;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /_auth/check {
        internal;
        proxy_pass http://127.0.0.1:4180/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # Вход и выход — у fivenine-auth; стили страницы входа — общие с fivenine.space
    location ~ ^/(login|logout|invite$|api/) {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /_assets/ {
        root /var/www/tools;
        expires 1h;
    }

    location = / { return 302 https://fivenine.space/; }
    location = /analytics { return 301 /analytics/; }
    location = /tasks { return 301 /tasks/; }
    location = /roadmap { return 301 /roadmap/; }
    location = /assist { return 301 /assist/; }

    location ^~ /analytics/ {
        auth_request /_auth/check;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ^~ /tasks/ {
        auth_request /_auth/check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        client_max_body_size 21m;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:4190;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Дорожная карта — по ссылке без входа: в ней только публичные данные проектов.
    # Куки fivenine трекеру не передаём, логин тоже (пустой заголовок затирает подставной).
    location ^~ /roadmap/ {
        proxy_pass http://127.0.0.1:4190;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Панель бота: префикс /assist срезается, панель живёт на корне своего порта.
    # Кто вошёл — X-Auth-User от fivenine; панель верит ему только вместе с
    # X-Proxy-Secret (строка proxy_set_header в подключаемом файле, вне git).
    # Куки fivenine панели не нужны — не передаём.
    location ^~ /assist/ {
        auth_request /_auth/check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_name $upstream_http_x_auth_name;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        client_max_body_size 5m;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-Auth-Name $auth_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/xfix-assist-secret.conf;
    }

# Админка заявок в контуре инструментов: https://xfix.fivenine.space/leads/{admin,partners,checks}
# Вставляется в server{} 443 файла /etc/nginx/sites-available/xfix — рядом с /assist/, перед «location / { return 404; }».
# Вход — fivenine-auth (как у /tasks/ и /assist/). Сервер мини-приложения (127.0.0.1:8090) верит X-Auth-User
# только вместе с X-Proxy-Secret: строка proxy_set_header лежит в /etc/nginx/snippets/xfix-leads-secret.conf
# (вне git, права 600), тот же ключ — ADMIN_PROXY_SECRET в /etc/xfix-price.env.
# Префикс /leads НЕ срезается: страницы сервера сами живут под /leads/.
    location = /leads { return 301 /leads/; }
    location ^~ /leads/ {
        auth_request /_auth/check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        client_max_body_size 3m;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/xfix-leads-secret.conf;
    }
    location / { return 404; }

    location @login {
        return 302 /login?next=$request_uri;
    }
    location @forbidden {
        return 302 https://fivenine.space/?denied=1;
    }
}
