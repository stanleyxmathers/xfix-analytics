# fivenine.space: все страницы закрыты логином, кроме /login и общих стилей.
# Сертификат Let's Encrypt (certbot, автопродление по таймеру).

# HTTP и вход по IP → https://fivenine.space. ACME-проверки certbot отвечает сам на время продления.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://fivenine.space$request_uri; }
}

# www → основной домен
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fivenine.space;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/fivenine.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fivenine.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://fivenine.space$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fivenine.space;

    ssl_certificate /etc/letsencrypt/live/fivenine.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fivenine.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/tools;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Проверка сессии для каждого запроса
    location = /_auth/check {
        internal;
        proxy_pass http://127.0.0.1:4180/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # Аналитика переехала на xfix.fivenine.space/analytics/
    location = /dashboard { return 301 https://xfix.fivenine.space/analytics/; }
    location ^~ /dashboard/ { return 301 https://xfix.fivenine.space/analytics/; }

    # Публичные пути: страница входа, выход, API и общие стили
    location ~ ^/(login|logout|invite$|api/)  {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /_assets/ {
        auth_request off;
        expires 1h;
    }

    # Всё остальное — только после входа
    location / {
        auth_request /_auth/check;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        try_files $uri $uri/ =404;
        location ~ \.html$ {
            auth_request /_auth/check;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Strict-Transport-Security "max-age=15552000" always;
        }
    }

    location @login {
        return 302 /login?next=$request_uri;
    }
    location @forbidden {
        return 302 /?denied=1;
    }
}
